spring:
  datasource:
    url: jdbc:postgresql://localhost:5442/flashkart
    username: userservice
    password: userservice

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: FlashKart
    description: Production-grade e-commerce platform
    version: 0.0.1

app:
  security:
    jwt:
      # IMPORTANT: at least 32+ chars (256-bit). Better: base64 secret.
      secret: "kP9z$vR2#qW7!bF0@jH5%sD3^gC8&xL1*tN4_"
      issuer: "flashkart"
      access-token-ttl-minutes: 15